<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Álbum Digital CPF 2026</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:ital,wght@0,700;0,900;1,900&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>

<body class="bg-[#F4F8FF] font-['Inter']">
    <div id="cover-view" class="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900 overflow-hidden">

        <div
            class="relative w-full max-w-md aspect-[3/4] rounded-r-3xl shadow-2xl border-l-[15px] border-black border-y-4 border-r-4 border-blue-900 overflow-hidden">
            <img src="img/tapa-album-robotica.jpg" alt="Tapa del Álbum CPF Robótica Mundial 2026"
                class="absolute inset-0 w-full h-full object-cover z-0">

            <div class="absolute bottom-0 w-full h-1/3 bg-gradient-to-t from-black/80 to-transparent z-10"></div>

            <div class="absolute inset-x-0 bottom-10 flex justify-center z-20">
                <button id="btn-start"
                    class="bg-gradient-to-r from-yellow-400 to-yellow-500 hover:from-yellow-300 hover:to-yellow-400 text-blue-900 font-black py-4 px-10 rounded-full text-xl shadow-[0_0_30px_rgba(234,179,8,0.6)] transform transition-all duration-300 hover:scale-110 active:scale-95 uppercase border-2 border-yellow-200 animate-pulse hover:animate-none" style="font-family: 'Poppins', sans-serif;">
                    ¡Abrir mi álbum!
                </button>
            </div>

            <div
                class="absolute top-0 right-0 w-32 h-full bg-white/10 skew-x-[-15deg] translate-x-10 pointer-events-none z-30">
            </div>
        </div>
    </div>

    <div id="album-view"
        class="album-page bg-slate-100 min-h-screen max-w-6xl mx-auto px-3 md:px-5 py-4 mt-2 md:mt-3 shadow-2xl rounded-lg"
        style="display: none; opacity: 0;">

        <div
            class="relative flex flex-col md:flex-row justify-between items-center mb-5 bg-[#0d2b52]/95 backdrop-blur-lg p-3 md:p-4 border-2 border-[#00f0ff]/40 shadow-[0_0_20px_rgba(0,240,255,0.15)] rounded-xl overflow-hidden">

            <div class="absolute -top-16 -right-16 w-32 h-40 bg-[#d42b20] rotate-45 z-0 opacity-90 shadow-[0_0_15px_#d42b20]"></div>
            <div class="absolute bottom-0 left-0 w-full h-[3px] bg-slate-800 z-0"></div>
            <div id="header-progress" class="absolute bottom-0 left-0 h-[3px] bg-[#00f0ff] z-0 shadow-[0_0_10px_#00f0ff] transition-all duration-1000 ease-out" style="width: 0%;"></div>
            <div class="scanner-laser"></div>
            <div class="absolute top-0 right-1/4 w-[2px] h-full bg-[#00f0ff]/30 z-0 skew-x-12"></div>

            <div class="flex items-center gap-4 relative z-10">
                <div
                    class="bg-white p-1 rounded-full border-2 border-[#00f0ff] shadow-[0_0_15px_rgba(0,240,255,0.4)] flex items-center justify-center w-14 h-14 md:w-16 md:h-16 overflow-hidden">
                    <img src="img/logo-cpf.jpg" alt="Logo Colegio Paulo Freire" class="w-full h-full object-contain" />
                </div>
                <div>
                    <p
                        class="text-[10px] md:text-xs text-[#00f0ff] font-bold tracking-[0.4em] uppercase mb-[-2px] drop-shadow-[0_0_5px_#00f0ff]">
                        SISTEMA OFICIAL
                    </p>
                    <h1 class="text-2xl md:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-[#00f0ff] italic tracking-tight drop-shadow-md"
                        style="font-family: 'Montserrat', sans-serif;">
                        CPF ROBÓTICA MUNDIAL
                    </h1>
                </div>
            </div>

            <div class="relative z-10 flex flex-col md:flex-row items-center gap-4 mt-3 md:mt-0">
                <div class="bg-[#0a1930] px-5 py-2 rounded-lg border border-[#00f0ff]/30 shadow-[inset_0_0_10px_rgba(0,0,0,0.8),_0_0_10px_rgba(0,240,255,0.2)] text-center">
                    <span class="text-[9px] text-[#00f0ff] font-bold tracking-[0.2em] uppercase mb-1 opacity-80 block" style="font-family: 'Montserrat', sans-serif;">DATA_STORAGE</span>
                    <div class="font-mono text-2xl font-black text-[#00f0ff] flex items-center justify-center gap-2 drop-shadow-[0_0_5px_rgba(0,240,255,0.8)]">
                        <span id="counter-got" class="text-white">0</span>
                        <span class="text-[#00f0ff]/50 text-lg">/</span>
                        <span id="counter-total" class="text-white">0</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="album-controls flex justify-between items-center mb-4">
            <button id="btn-prev" onclick="cambiarPagina(-1)"
                class="album-nav-btn px-4 py-2 rounded-full font-bold transition-transform transform active:scale-95">
                ◀ Anterior
            </button>

            <h2 id="page-title"
                class="text-2xl md:text-3xl font-black text-center text-transparent bg-clip-text bg-gradient-to-r from-slate-800 to-slate-600 uppercase tracking-widest pb-1" style="font-family: 'Montserrat', sans-serif;">
                Cargando...
            </h2>

            <button id="btn-next" onclick="cambiarPagina(1)"
                class="album-nav-btn px-4 py-2 rounded-full font-bold transition-transform transform active:scale-95">
                Siguiente ▶
            </button>
        </div>

        <div id="album-grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4 mt-4 perspective-1000">
        </div>

    </div>

    <div id="modal-figurita" class="fixed inset-0 z-[999] bg-black/90 hidden items-center justify-center p-4"
        style="backdrop-filter: blur(10px);">

        <div class="relative premium-modal-card bg-white shadow-[0_20px_50px_rgba(0,0,0,0.5)] animate__animated animate__backInDown"
            style="width: 100%; max-width: 300px; aspect-ratio: 3/4; display: flex; flex-direction: column; overflow: visible;">

            <button onclick="cerrarModal()"
                style="position: absolute; top: -15px; right: -15px; width: 35px; height: 35px; background-color: #CC0000; color: white; border: 3px solid white; border-radius: 50%; font-family: sans-serif; font-weight: bold; font-size: 18px; z-index: 1000; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
                ✕
            </button>

            <div class="holo-bg"
                style="width: 100%; height: 100%; position: relative; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden;">

                <div class="gold-seal"
                    style="position: absolute; top: 8px; left: 8px; width: 40px; height: 40px; border-radius: 50%; padding: 3px; z-index: 50;">
                    <img src="img/logo-cpf.jpg" style="width: 100%; height: 100%; object-fit: contain; border-radius: 50%;">
                </div>

                <div class="seal-text"
                    style="position: absolute; top: 10px; right: 10px; padding: 3px 8px; border-radius: 4px; font-family: 'Courier New', monospace; font-size: 11px; font-weight: bold; z-index: 50;">
                    #<span id="modal-id">000</span>
                </div>

                <img id="modal-img" src=""
                    style="width: 100%; height: 100%; object-fit: cover; z-index: 10; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8)); border-radius: 8px;">
            </div>
        </div>
    </div>
    <footer class="relative mt-12 mb-4 w-full px-6 flex justify-between items-center pt-6">
        <!-- Laser Top Border -->
        <div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-[#00f0ff] to-transparent opacity-80"></div>

        <!-- Left: Logo & Terminal Text -->
        <div class="flex items-center gap-3">
            <div
                class="w-10 h-10 rounded-full border-2 border-[#00f0ff] bg-white p-0.5 shadow-[0_0_10px_rgba(0,240,255,0.4)] overflow-hidden flex items-center justify-center">
                <img src="img/logo-cpf.jpg" alt="Logo CPF" class="w-full h-full object-contain" />
            </div>
            <div class="flex flex-col">
                <span class="text-[10px] text-[#00f0ff] font-mono tracking-widest opacity-60">SISTEMA CONECTADO...</span>
                <span class="text-xs md:text-sm text-[#00f0ff] font-bold uppercase tracking-wider drop-shadow-[0_0_3px_#00f0ff]" style="font-family: 'Montserrat', sans-serif;">
                    MODO ONLINE
                </span>
            </div>
        </div>

        <!-- Center: Barcode -->
        <div class="hidden md:flex flex-col items-center justify-center opacity-70">
            <div class="text-[#00f0ff] text-xl font-black tracking-[-0.15em] mix-blend-screen" style="transform: scaleY(1.5);">
                ||| | || |||| | || | ||| ||| |
            </div>
            <span class="text-[8px] text-[#00f0ff] font-mono tracking-widest mt-1">SERIE-2026-X7</span>
        </div>

        <!-- Right: Page Number Nucleus -->
        <div class="flex items-center gap-3">
            <span class="text-[9px] text-[#00f0ff] font-mono uppercase tracking-[0.2em] opacity-60">LOC</span>
            <div id="footer-page-number"
                class="bg-[#0a1930] text-[#00f0ff] font-mono text-xl font-bold w-12 h-12 flex items-center justify-center shadow-[0_0_15px_rgba(0,240,255,0.3)] border-2 border-[#00f0ff] rounded-full drop-shadow-[0_0_8px_#00f0ff]">
                1
            </div>
        </div>
    </footer>

    <!-- MODAL INGRESO QR -->
    <div id="modal-qr" class="fixed inset-0 z-[300] hidden items-center justify-center bg-[#0a1930]/90 backdrop-blur-sm p-4">
        <div class="bg-[#1e293b] w-full max-w-sm rounded-xl border-2 border-[#00f0ff] shadow-[0_0_30px_rgba(0,240,255,0.3)] p-6 relative flex flex-col items-center text-center animate__animated animate__zoomIn">
            <button onclick="cerrarModalQR()" class="absolute top-2 right-3 text-[#00f0ff] hover:text-white font-bold text-xl z-10">&times;</button>
            <div class="w-16 h-16 bg-[#00f0ff]/10 rounded-full flex items-center justify-center border border-[#00f0ff] mb-2 shadow-[0_0_15px_rgba(0,240,255,0.5)]">
                <svg class="w-8 h-8 text-[#00f0ff]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
            </div>
            <h3 class="text-[#00f0ff] font-black text-xl mb-1 font-mono uppercase tracking-widest">Decodificador</h3>
            
            <div id="qr-reader" class="w-full bg-black mb-4 rounded overflow-hidden hidden" style="min-height: 200px;"></div>
            
            <p class="text-slate-300 text-sm mb-3">Escanea el código QR o ingresa el código manual.</p>
            
            <div class="flex w-full gap-2 mb-4">
                <button onclick="activarCamara()" id="btn-camara" class="bg-slate-700 hover:bg-slate-600 text-white p-3 rounded flex items-center justify-center transition-colors" title="Activar Cámara">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
                <input type="text" id="qr-input" placeholder="Ej: JUAN-P" class="w-full bg-[#0a1930] text-[#00f0ff] font-mono text-center text-xl p-3 rounded border border-[#00f0ff]/50 outline-none focus:border-[#00f0ff] focus:shadow-[0_0_10px_rgba(0,240,255,0.5)] uppercase">
            </div>
            
            <button onclick="procesarCodigoQR()" class="w-full bg-[#00f0ff] hover:bg-[#00d0e0] text-[#0a1930] font-black py-3 rounded-lg uppercase tracking-widest transition-all">
                INICIAR DESCARGA
            </button>
            <p id="qr-error" class="text-red-500 font-bold mt-3 text-sm hidden"></p>
        </div>
    </div>

    <!-- MODAL PACK OPENING CINEMATIC -->
    <div id="modal-pack-opening" class="fixed inset-0 z-[400] hidden items-center justify-center bg-black/95 overflow-hidden">
        <div id="pack-container" class="relative flex items-center justify-center w-full h-full perspective-1000">
            <!-- Pack / Sobre -->
            <div id="virtual-pack" class="virtual-pack cursor-pointer transition-all duration-300 hover:scale-105">
                <div class="virtual-pack-front border-2 border-[#00f0ff] rounded-xl overflow-hidden shadow-[0_0_50px_rgba(0,240,255,0.4)] relative bg-gradient-to-br from-[#0a1930] to-[#1e293b] p-2 flex flex-col items-center justify-center">
                    <img src="img/logo-cpf.jpg" class="w-16 h-16 rounded-full border-2 border-[#00f0ff] mb-4">
                    <h2 class="text-[#00f0ff] font-black text-2xl font-mono text-center leading-none">CPF<br>2026</h2>
                    <p class="text-white/50 text-[10px] mt-2 tracking-[0.2em]">PULSA PARA ABRIR</p>
                    <div class="absolute inset-0 bg-gradient-to-t from-[#00f0ff]/20 to-transparent pointer-events-none"></div>
                </div>
            </div>
            
            <!-- La carta revelada (oculta al inicio) -->
            <div id="revealed-card" class="hidden figurita-pegada aspect-[3/4] w-64 md:w-80 rounded-lg overflow-hidden border-4 border-[#eab308] shadow-[0_0_40px_rgba(234,179,8,0.6)]">
                <img id="revealed-img" src="" alt="" class="w-full h-full object-cover">
                <div class="absolute bottom-0 w-full bg-white/95 p-3 flex flex-col justify-center border-t-4 border-[#003366]">
                    <h3 id="revealed-name" class="text-[#003366] font-black text-xl italic text-center uppercase"></h3>
                </div>
            </div>
        </div>
    </div>

    <script src="data/alumnos.js?v=1.6"></script>
    <script src="js/app.js?v=1.6"></script>
</body>

</html>
